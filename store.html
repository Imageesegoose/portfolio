<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Store - cordacreative</title>
  <meta name="description" content="Browse and purchase prints, vintage items, and photography from cordacreative." />
  <!-- Google Font: Major Mono Display -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Major+Mono+Display&display=swap" rel="stylesheet" crossorigin="anonymous">
  <!-- site CSS -->
  <link rel="stylesheet" href="assets/css/styles.css" />
  <link rel="stylesheet" href="assets/css/store.css" />
</head>
<body>
  <header class="site-header">
    <div class="wrap header-inner">
      <a class="brand" href="index.html">
        <img src="assets/images/logo.svg" alt="Logo" class="logo">
        <span class="site-title"></span>
      </a>
      <button class="mobile-menu-btn" aria-label="Toggle menu" id="mobile-menu-btn">
        <span>☰</span>
      </button>
      <nav class="site-nav" id="site-nav">
        <a href="index.html#home">Home</a>
        <div class="dropdown">
          <a href="#">Work</a>
          <div class="dropdown-content">
            <a href="adventure.html">Adventure</a>
            <a href="faces.html">Faces</a>
            <a href="portraits.html">Portraits</a>
            <a href="higher-education.html">Higher Education</a>
            <a href="publications.html">Publications</a>
          </div>
        </div>
        <a href="about.html">About</a>
        <a href="index.html#contact">Contact</a>
      </nav>
    </div>
    <div class="mobile-menu-overlay" id="mobile-menu-overlay"></div>
  </header>

  <main>
    <section class="store-container">
      <div class="store-header">
        <h2>Store</h2>
        <p class="lead">Browse our collection of prints and vintage items. All prices are in USD.</p>
      </div>

      <div id="products-container" class="products-grid">
        <div class="loading-message">Loading products...</div>
      </div>
    </section>
  </main>

  <footer class="site-footer wrap">
    <div class="footer-toggle">
      <label for="dark-mode-toggle">
        <input type="checkbox" id="dark-mode-toggle" /> Enable Dark Mode
      </label>
    </div>
    <small>© <span id="year"></span> Your Name</small>
  </footer>

  <script src="assets/js/main.js"></script>
  <script>
    (function() {
      'use strict';
      
      const PAYPAL_EMAIL = 'placeholder@example.com'; // TODO: Replace with actual PayPal business email before deployment
      const productsContainer = document.getElementById('products-container');
      
      // Fetch and display products
      fetch('products.json')
        .then(response => {
          if (!response.ok) {
            throw new Error('Failed to load products');
          }
          return response.json();
        })
        .then(products => {
          // Clear loading message
          productsContainer.innerHTML = '';
          
          // Create product cards
          products.forEach(product => {
            const card = createProductCard(product);
            productsContainer.appendChild(card);
          });
        })
        .catch(error => {
          console.error('Error loading products:', error);
          productsContainer.innerHTML = '<div class="error-message">Failed to load products. Please try again later.</div>';
        });
      
      // Create a product card element
      function createProductCard(product) {
        const card = document.createElement('div');
        card.className = 'product-card';
        
        // Product image
        const img = document.createElement('img');
        img.src = product.image;
        img.alt = product.name;
        img.className = 'product-image';
        img.loading = 'lazy';
        
        // Add error handler for failed image loads
        img.addEventListener('error', function() {
          // Use a fallback color background if image fails to load
          this.style.background = 'rgba(0, 0, 0, 0.1)';
          this.alt = product.name + ' (Image not available)';
        });
        
        // Product info container
        const info = document.createElement('div');
        info.className = 'product-info';
        
        // Product name
        const name = document.createElement('h3');
        name.className = 'product-name';
        name.textContent = product.name;
        
        // Product description
        const description = document.createElement('p');
        description.className = 'product-description';
        description.textContent = product.description;
        
        // Product price
        const price = document.createElement('div');
        price.className = 'product-price';
        price.textContent = '$' + product.price;
        
        // PayPal Buy Now button
        const paypalContainer = document.createElement('div');
        paypalContainer.className = 'paypal-button-container';
        
        const form = document.createElement('form');
        form.action = 'https://www.paypal.com/cgi-bin/webscr';
        form.method = 'post';
        form.target = '_blank';
        form.className = 'paypal-form';
        
        // PayPal form fields
        const fields = [
          { name: 'cmd', value: '_xclick' },
          { name: 'business', value: PAYPAL_EMAIL },
          { name: 'item_name', value: product.name },
          { name: 'item_number', value: product.id },
          { name: 'amount', value: product.price },
          { name: 'currency_code', value: 'USD' },
          { name: 'button_subtype', value: 'services' },
          { name: 'no_note', value: '0' },
          { name: 'bn', value: 'PP-BuyNowBF:btn_buynow_LG.gif:NonHostedGuest' }
        ];
        
        fields.forEach(field => {
          const input = document.createElement('input');
          input.type = 'hidden';
          input.name = field.name;
          input.value = field.value;
          form.appendChild(input);
        });
        
        // Styled buy button
        const buyButton = document.createElement('button');
        buyButton.type = 'submit';
        buyButton.className = 'buy-button';
        buyButton.textContent = 'Buy Now';
        
        form.appendChild(buyButton);
        paypalContainer.appendChild(form);
        
        // Assemble the card
        info.appendChild(name);
        info.appendChild(description);
        info.appendChild(price);
        info.appendChild(paypalContainer);
        
        card.appendChild(img);
        card.appendChild(info);
        
        return card;
      }
    })();
  </script>
</body>
</html>
